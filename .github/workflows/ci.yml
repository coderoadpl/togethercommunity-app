name: ci

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together
          POSTGRES_DB: together
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U together"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: postgres://together:together@localhost:5432/together
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-edge.sources /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: TOGETHER_TEST_SERIAL=1 pnpm run check
      - name: pnpm audit --prod --audit-level=moderate
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm audit --prod --audit-level=moderate; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "pnpm audit failed (attempt $attempt/5), retrying in 30s..."
            sleep 30
          done

  visual:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: 152.0.7977.82
      - run: '"$CHROME_PATH" --version'
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Pin native macOS date controls to the golden authoring locale
        run: |
          defaults write NSGlobalDomain AppleLocale -string en_PL
          defaults write NSGlobalDomain AppleLanguages -array en-PL
          defaults write NSGlobalDomain AppleICUForce24HourTime -bool true
      - run: pnpm run visual
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual
          path: app/out/visual

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together
          POSTGRES_DB: together
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U together"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://together:together@localhost:5432/together
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke
      - id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.47
      - run: '"$CHROME_PATH" --version'
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: pnpm run quickstart:probe
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [auth, poc, subs, marketing, coupon, public-authz, member-activity, member-shell, impersonation, two-factor, image-assets, custom-domain]
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together
          POSTGRES_DB: together
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U together"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://together:together@localhost:5432/together
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: matrix.suite == 'auth' || matrix.suite == 'coupon' || matrix.suite == 'public-authz' || matrix.suite == 'member-activity' || matrix.suite == 'member-shell' || matrix.suite == 'impersonation' || matrix.suite == 'two-factor' || matrix.suite == 'image-assets' || matrix.suite == 'custom-domain'
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.47
      - if: matrix.suite == 'auth' || matrix.suite == 'coupon' || matrix.suite == 'public-authz' || matrix.suite == 'member-activity' || matrix.suite == 'member-shell' || matrix.suite == 'impersonation' || matrix.suite == 'two-factor' || matrix.suite == 'image-assets' || matrix.suite == 'custom-domain'
        run: '"$CHROME_PATH" --version'
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - if: matrix.suite == 'auth'
        run: pnpm run fixtures:check
        env:
          DATABASE_URL: postgres://together:together@localhost:5432/together
      - if: matrix.suite == 'auth'
        run: pnpm run visual:app
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - if: always() && matrix.suite == 'auth'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-app
          path: app/out/visual-app
      - name: Run E2E suite
        shell: bash
        run: |
          mkdir -p e2e-artifacts
          set +e
          pnpm run e2e:${{ matrix.suite }} 2>&1 | tee "e2e-artifacts/${{ matrix.suite }}.log"
          status="${PIPESTATUS[0]}"
          set -e
          exit "$status"
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ matrix.suite }}-failure
          path: |
            app/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  release-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, visual, smoke, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: derive
        run: |
          pnpm --silent exec tsx scripts/derive-version.ts --json > "$RUNNER_TEMP/version.json"
          cat "$RUNNER_TEMP/version.json"
          {
            echo "version=$(jq -r .version "$RUNNER_TEMP/version.json")"
            echo "promotion=$(jq -r .promotion "$RUNNER_TEMP/version.json")"
            echo "complete=$(jq -r .complete "$RUNNER_TEMP/version.json")"
          } >> "$GITHUB_OUTPUT"
      - name: tag the promotion and publish its changelog
        if: steps.derive.outputs.promotion == 'true' && steps.derive.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.derive.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists — release tags are immutable, nothing to do"
            exit 0
          fi
          changelog="$RUNNER_TEMP/CHANGELOG.md"
          pnpm --silent exec tsx scripts/changelog.ts --version "$VERSION" > "$changelog"
          cat "$changelog"
          jq -n \
            --arg tag "$tag" \
            --arg message "$(cat "$changelog")" \
            --arg object "$GITHUB_SHA" \
            '{ tag: $tag, message: $message, object: $object, type: "commit" }' \
            > "$RUNNER_TEMP/tag.json"
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" --input "$RUNNER_TEMP/tag.json" --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$object"
          gh release create "$tag" --title "$tag" --notes-file "$changelog"
