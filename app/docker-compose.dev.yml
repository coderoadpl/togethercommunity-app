name: together-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: together
      POSTGRES_PASSWORD: together
      POSTGRES_DB: together
    ports:
      - '${DB_PORT:-48912}:5432'
    volumes:
      - together-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U together']
      interval: 3s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - '${MAILPIT_SMTP_PORT:-47925}:1025'
      - '${MAILPIT_API_PORT:-47980}:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'

volumes:
  together-pgdata:
