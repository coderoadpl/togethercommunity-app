name: ci

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together
          POSTGRES_DB: together
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U together"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: postgres://together:together@localhost:5432/together
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: pnpm run check
      - run: pnpm run storybook:build
      - name: pnpm audit --prod --audit-level=moderate
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm audit --prod --audit-level=moderate; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "pnpm audit failed (attempt $attempt/5), retrying in 30s..."
            sleep 30
          done

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together
          POSTGRES_DB: together
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U together"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://together:together@localhost:5432/together
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke
      - id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.47
      - run: '"$CHROME_PATH" --version'
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: pnpm run quickstart:probe
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [auth, poc, subs, marketing, coupon, public-authz, member-activity, member-shell, impersonation, two-factor, image-assets, custom-domain]
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together
          POSTGRES_DB: together
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U together"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://together:together@localhost:5432/together
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: matrix.suite == 'auth' || matrix.suite == 'coupon' || matrix.suite == 'public-authz' || matrix.suite == 'member-activity' || matrix.suite == 'member-shell' || matrix.suite == 'impersonation' || matrix.suite == 'two-factor' || matrix.suite == 'image-assets' || matrix.suite == 'custom-domain'
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.47
      - if: matrix.suite == 'auth' || matrix.suite == 'coupon' || matrix.suite == 'public-authz' || matrix.suite == 'member-activity' || matrix.suite == 'member-shell' || matrix.suite == 'impersonation' || matrix.suite == 'two-factor' || matrix.suite == 'image-assets' || matrix.suite == 'custom-domain'
        run: '"$CHROME_PATH" --version'
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: pnpm run e2e:${{ matrix.suite }}
        env:
          PLAYWRIGHT_CHROME_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  release-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, smoke, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: derive
        run: |
          pnpm --silent exec tsx scripts/derive-version.ts --json > "$RUNNER_TEMP/version.json"
          cat "$RUNNER_TEMP/version.json"
          {
            echo "version=$(jq -r .version "$RUNNER_TEMP/version.json")"
            echo "promotion=$(jq -r .promotion "$RUNNER_TEMP/version.json")"
            echo "complete=$(jq -r .complete "$RUNNER_TEMP/version.json")"
          } >> "$GITHUB_OUTPUT"
      - name: tag the promotion and publish its changelog
        if: steps.derive.outputs.promotion == 'true' && steps.derive.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.derive.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists — release tags are immutable, nothing to do"
            exit 0
          fi
          changelog="$RUNNER_TEMP/CHANGELOG.md"
          pnpm --silent exec tsx scripts/changelog.ts --version "$VERSION" > "$changelog"
          cat "$changelog"
          jq -n \
            --arg tag "$tag" \
            --arg message "$(cat "$changelog")" \
            --arg object "$GITHUB_SHA" \
            '{ tag: $tag, message: $message, object: $object, type: "commit" }' \
            > "$RUNNER_TEMP/tag.json"
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" --input "$RUNNER_TEMP/tag.json" --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$object"
          gh release create "$tag" --title "$tag" --notes-file "$changelog"
