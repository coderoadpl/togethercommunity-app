          PREPARE_MODE: revalidate
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          BASE_REF: ${{ steps.prepare.outputs.base_ref }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/prepare-review.sh"

      - name: Post the review verdict
        if: ${{ always() && github.event_name == 'pull_request' && steps.current.outputs.current == 'true' && !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ steps.target.outputs.pr }}
          CURRENT: ${{ steps.current.outputs.current }}
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          O_1P: ${{ steps.classify1p.outputs.outcome }}
          R_1P: ${{ steps.classify1p.outputs.reason }}
          RAW_1P: ${{ steps.try1p.outputs.structured_output }}
          LOG_1P: ${{ steps.classify1p.outputs.log }}
          MODEL_1P: ${{ steps.prepare.outputs.primary_model }}
          O_1PR: ${{ steps.classify1pr.outputs.outcome }}
          R_1PR: ${{ steps.classify1pr.outputs.reason }}
          RAW_1PR: ${{ steps.try1pr.outputs.structured_output }}
          LOG_1PR: ${{ steps.classify1pr.outputs.log }}
          MODEL_1PR: ${{ steps.prepare.outputs.primary_model }}
          O_1F: ${{ steps.classify1f.outputs.outcome }}
          R_1F: ${{ steps.classify1f.outputs.reason }}
          RAW_1F: ${{ steps.try1f.outputs.structured_output }}
          LOG_1F: ${{ steps.classify1f.outputs.log }}
          MODEL_1F: ${{ steps.prepare.outputs.fallback_model }}
          O_1FR: ${{ steps.classify1fr.outputs.outcome }}
          R_1FR: ${{ steps.classify1fr.outputs.reason }}
          RAW_1FR: ${{ steps.try1fr.outputs.structured_output }}
          LOG_1FR: ${{ steps.classify1fr.outputs.log }}
          MODEL_1FR: ${{ steps.prepare.outputs.fallback_model }}
          O_2P: ${{ steps.classify2p.outputs.outcome }}
          R_2P: ${{ steps.classify2p.outputs.reason }}
          RAW_2P: ${{ steps.try2p.outputs.structured_output }}
          LOG_2P: ${{ steps.classify2p.outputs.log }}
          MODEL_2P: ${{ steps.prepare.outputs.primary_model }}
          O_2PR: ${{ steps.classify2pr.outputs.outcome }}
          R_2PR: ${{ steps.classify2pr.outputs.reason }}
          RAW_2PR: ${{ steps.try2pr.outputs.structured_output }}
          LOG_2PR: ${{ steps.classify2pr.outputs.log }}
          MODEL_2PR: ${{ steps.prepare.outputs.primary_model }}
          O_2F: ${{ steps.classify2f.outputs.outcome }}
          R_2F: ${{ steps.classify2f.outputs.reason }}
          RAW_2F: ${{ steps.try2f.outputs.structured_output }}
          LOG_2F: ${{ steps.classify2f.outputs.log }}
          MODEL_2F: ${{ steps.prepare.outputs.fallback_model }}
          O_2FR: ${{ steps.classify2fr.outputs.outcome }}
          R_2FR: ${{ steps.classify2fr.outputs.reason }}
          RAW_2FR: ${{ steps.try2fr.outputs.structured_output }}
          LOG_2FR: ${{ steps.classify2fr.outputs.log }}
          MODEL_2FR: ${{ steps.prepare.outputs.fallback_model }}
          O_3P: ${{ steps.classify3p.outputs.outcome }}
          R_3P: ${{ steps.classify3p.outputs.reason }}
          RAW_3P: ${{ steps.try3p.outputs.structured_output }}
          LOG_3P: ${{ steps.classify3p.outputs.log }}
          MODEL_3P: ${{ steps.prepare.outputs.primary_model }}
          O_3PR: ${{ steps.classify3pr.outputs.outcome }}
          R_3PR: ${{ steps.classify3pr.outputs.reason }}
          RAW_3PR: ${{ steps.try3pr.outputs.structured_output }}
          LOG_3PR: ${{ steps.classify3pr.outputs.log }}
          MODEL_3PR: ${{ steps.prepare.outputs.primary_model }}
          O_3F: ${{ steps.classify3f.outputs.outcome }}
          R_3F: ${{ steps.classify3f.outputs.reason }}
          RAW_3F: ${{ steps.try3f.outputs.structured_output }}
          LOG_3F: ${{ steps.classify3f.outputs.log }}
          MODEL_3F: ${{ steps.prepare.outputs.fallback_model }}
          O_3FR: ${{ steps.classify3fr.outputs.outcome }}
          R_3FR: ${{ steps.classify3fr.outputs.reason }}
          RAW_3FR: ${{ steps.try3fr.outputs.structured_output }}
          LOG_3FR: ${{ steps.classify3fr.outputs.log }}
          MODEL_3FR: ${{ steps.prepare.outputs.fallback_model }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/post-review.sh"

      - name: Summarize dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "DRY RUN — NO AI VERDICT — DOES NOT SATISFY ai-review" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate — fail-closed verdict
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          TRUSTED_INSTALLED: ${{ steps.trusted.outputs.installed }}
          PREPARED: ${{ steps.prepare.outputs.prepared }}
          CURRENT: ${{ steps.current.outputs.current }}
          DRAFT: ${{ steps.target.outputs.draft }}
          O_1P: ${{ steps.classify1p.outputs.outcome }}
          O_1PR: ${{ steps.classify1pr.outputs.outcome }}
          O_1F: ${{ steps.classify1f.outputs.outcome }}
          O_1FR: ${{ steps.classify1fr.outputs.outcome }}
          O_2P: ${{ steps.classify2p.outputs.outcome }}
          O_2PR: ${{ steps.classify2pr.outputs.outcome }}
          O_2F: ${{ steps.classify2f.outputs.outcome }}
          O_2FR: ${{ steps.classify2fr.outputs.outcome }}
          O_3P: ${{ steps.classify3p.outputs.outcome }}
          O_3PR: ${{ steps.classify3pr.outputs.outcome }}
          O_3F: ${{ steps.classify3f.outputs.outcome }}
          O_3FR: ${{ steps.classify3fr.outputs.outcome }}
        run: |
          if [ "$TRUSTED_INSTALLED" != true ]; then
            echo "bootstrap-not-installed: trusted AI review gate is unavailable"
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/.github/scripts/gate-review.sh"
