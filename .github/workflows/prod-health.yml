name: prod-health
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      test_sms:
        description: Send a test SMS regardless of health
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: prod-health
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Send a test SMS
        if: inputs.test_sms
        uses: ./.github/actions/alert-sms
        with:
          message: 'Together prod-health: test SMS - the alert channel works'
          aws-access-key-id: ${{ secrets.ALERT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ALERT_AWS_SECRET_ACCESS_KEY }}
          phone-number: ${{ secrets.ALERT_SMS_PHONE }}
          required: 'true'
      - name: Probe production health
        id: probe
        run: |
          body=$(curl -sS --max-time 15 --retry 2 --retry-delay 5 https://coderoad.togethercommunity.app/api/health) || {
            echo "reason=health endpoint unreachable" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "$body" | head -c 400
          ok=$(echo "$body" | jq -r '.ok')
          database=$(echo "$body" | jq -r '.data.database')
          schema=$(echo "$body" | jq -r '.data.schemaCurrent')
          fingerprint=$(echo "$body" | jq -r '.data.schemaFingerprintMatch // "absent"')
          if [ "$ok" != "true" ] || [ "$database" != "up" ] || [ "$schema" != "true" ] || [ "$fingerprint" = "false" ]; then
            echo "reason=ok=$ok database=$database schemaCurrent=$schema fingerprintMatch=$fingerprint" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deep_status=$(curl -sS -o deep.json -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 5 https://coderoad.togethercommunity.app/api/health/deep) || {
            echo "reason=deep health endpoint unreachable" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          head -c 800 deep.json
          if [ "$deep_status" != "200" ]; then
            failing=$(jq -r '(.data.failing // []) | join(",")' deep.json)
            echo "reason=deep health $deep_status failing=${failing:-unknown}" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "failed=false" >> "$GITHUB_OUTPUT"
      - name: Check whether this failure is a fresh incident
        id: incident
        if: steps.probe.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api "repos/${{ github.repository }}/actions/workflows/prod-health.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].conclusion' || echo "unknown")
          if [ "$previous" = "failure" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Send an SMS alert
        if: steps.probe.outputs.failed == 'true' && steps.incident.outputs.fresh == 'true' && !inputs.test_sms
        uses: ./.github/actions/alert-sms
        with:
          message: 'Together prod health FAILED: ${{ steps.probe.outputs.reason }}'
          aws-access-key-id: ${{ secrets.ALERT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ALERT_AWS_SECRET_ACCESS_KEY }}
          phone-number: ${{ secrets.ALERT_SMS_PHONE }}
      - name: Check whether production just recovered
        id: recovery
        if: steps.probe.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api "repos/${{ github.repository }}/actions/workflows/prod-health.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].conclusion' || echo "unknown")
          if [ "$previous" = "failure" ]; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          else
            echo "recovered=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Send a recovery SMS
        if: steps.probe.outputs.failed == 'false' && steps.recovery.outputs.recovered == 'true' && !inputs.test_sms
        uses: ./.github/actions/alert-sms
        with:
          message: 'Together prod health RECOVERED: health and deep probes green'
          aws-access-key-id: ${{ secrets.ALERT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ALERT_AWS_SECRET_ACCESS_KEY }}
          phone-number: ${{ secrets.ALERT_SMS_PHONE }}
      - name: Fail the run on unhealthy production
        if: steps.probe.outputs.failed == 'true'
        run: |
          echo "::error::${{ steps.probe.outputs.reason }}"
          exit 1
