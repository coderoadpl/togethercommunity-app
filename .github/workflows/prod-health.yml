name: prod-health
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      test_sms:
        description: Send a test SMS regardless of health
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: prod-health
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PROD_HEALTH_HOST: ${{ vars.PROD_HEALTH_HOST || format('{0}.togethercommunity.app', vars.SMOKE_TENANT || 'acme') }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Send a test SMS
        if: inputs.test_sms
        uses: ./.github/actions/alert-sms
        with:
          message: 'Together prod-health: test SMS - the alert channel works'
          aws-access-key-id: ${{ secrets.ALERT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ALERT_AWS_SECRET_ACCESS_KEY }}
          phone-number: ${{ secrets.ALERT_SMS_PHONE }}
          required: 'true'
      - name: Probe production health
        id: probe
        run: |
          measured=health
          report() {
            echo "checks=$measured" >> "$GITHUB_OUTPUT"
            echo "failing=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            exit 0
          }
          body=$(curl -sS --max-time 15 --retry 2 --retry-delay 5 "https://$PROD_HEALTH_HOST/api/health") \
            || report health "health endpoint unreachable"
          echo "$body" | head -c 400
          ok=$(echo "$body" | jq -r '.ok')
          database=$(echo "$body" | jq -r '.data.database')
          schema=$(echo "$body" | jq -r '.data.schemaCurrent')
          fingerprint=$(echo "$body" | jq -r '.data.schemaFingerprintMatch // "absent"')
          if [ "$ok" != "true" ] || [ "$database" != "up" ] || [ "$schema" != "true" ] || [ "$fingerprint" = "false" ]; then
            report health "ok=$ok database=$database schemaCurrent=$schema fingerprintMatch=$fingerprint"
          fi
          measured=health,deep-health
          deep_status=$(curl -sS -o deep.json -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 5 "https://$PROD_HEALTH_HOST/api/health/deep") \
            || report deep-health "deep health endpoint unreachable"
          head -c 800 deep.json
          if [ "$deep_status" != "200" ]; then
            failing=$(jq -r '(.data.failing // []) | join(",")' deep.json)
            report deep-health "deep health $deep_status failing=${failing:-unknown}"
          fi
          report "" "health and deep probes green"
      - name: Gate the alert on a state change
        id: alert
        uses: ./.github/actions/alert-gate
        with:
          monitor: prod-health.yml
          environment: production
          failing: ${{ steps.probe.outputs.failing }}
          checks: ${{ steps.probe.outputs.checks }}
          github-token: ${{ github.token }}
      - name: Send an SMS alert
        if: steps.alert.outputs.should_page == 'true' && !inputs.test_sms
        uses: ./.github/actions/alert-sms
        with:
          message: 'Together prod health FAILED: ${{ steps.probe.outputs.reason }}'
          aws-access-key-id: ${{ secrets.ALERT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ALERT_AWS_SECRET_ACCESS_KEY }}
          phone-number: ${{ secrets.ALERT_SMS_PHONE }}
      - name: Send a recovery SMS
        if: steps.alert.outputs.recovered == 'true' && !inputs.test_sms
        uses: ./.github/actions/alert-sms
        with:
          message: 'Together prod health RECOVERED: health and deep probes green'
          aws-access-key-id: ${{ secrets.ALERT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ALERT_AWS_SECRET_ACCESS_KEY }}
          phone-number: ${{ secrets.ALERT_SMS_PHONE }}
      - name: Fail the run on unhealthy production
        if: steps.probe.outputs.failing != ''
        env:
          REASON: ${{ steps.probe.outputs.reason }}
        run: |
          echo "::error::$REASON"
          exit 1
