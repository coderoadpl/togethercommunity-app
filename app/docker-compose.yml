name: ${COMPOSE_PROJECT_NAME:-together-self-host}

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-together-self-host}-app:latest
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_DRIVER: node-postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: '48730'
      INTERNAL_PORT: '48732'

  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '${SELF_HOST_HTTP_PORT:-80}:80'
      - '${SELF_HOST_HTTPS_PORT:-443}:443'
      - '${SELF_HOST_HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
