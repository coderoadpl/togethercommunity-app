name: visual golden gallery

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: visual-golden-gallery-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const marker = '<!-- visual-golden-gallery -->';
            const root = 'app/tasks/visual-goldens/';
            const baselinePath = /^app\/tasks\/visual-goldens\/(?:[A-Za-z0-9._-]+\/)*[A-Za-z0-9._-]+\.png$/;
            const maxRows = 100;
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const baseTipSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const isBaseline = (path) =>
              typeof path === 'string' &&
              baselinePath.test(path) &&
              !path.split('/').includes('..');
            const relative = (path) => path.slice(root.length);
            const changes = files.flatMap((file) => {
              if (file.status === 'unchanged') return [];
              const current = isBaseline(file.filename) ? file.filename : undefined;
              const previous = isBaseline(file.previous_filename)
                ? file.previous_filename
                : undefined;
              let before;
              let after;
              let status = file.status;
              if (file.status === 'added' || file.status === 'copied') {
                after = current;
                status = 'added';
              } else if (file.status === 'removed') {
                before = current;
              } else if (file.status === 'renamed') {
                before = previous;
                after = current;
                if (!before) status = 'added';
                if (!after) status = 'removed';
              } else {
                before = current;
                after = current;
                status = 'modified';
              }
              if (!before && !after) return [];
              const name = before && after && before !== after
                ? `${relative(before)} → ${relative(after)}`
                : relative(after ?? before);
              return [{ name, status, before, after }];
            }).sort((left, right) => left.name.localeCompare(right.name));
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (changes.length === 0 && !existing) return;
            let body = marker + '\n## Committed visual golden changes\n\n' +
              'This pull request has no committed visual baseline changes.';
            if (changes.length > 0) {
              let baseSha = baseTipSha;
              let baseDescription = 'merge base';
              try {
                const comparison = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: baseTipSha,
                  head: headSha,
                });
                baseSha = comparison.data.merge_base_commit.sha;
              } catch (error) {
                baseDescription = 'pull request base';
                core.warning(
                  'Could not resolve the merge base; using the pull request base commit: ' +
                  (error instanceof Error ? error.message : String(error)),
                );
              }
              const rawUrl = (sha, path) =>
                `https://github.com/${owner}/${repo}/raw/${sha}/` +
                path.split('/').map(encodeURIComponent).join('/');
              const blobUrl = (sha, path) =>
                `https://github.com/${owner}/${repo}/blob/${sha}/` +
                path.split('/').map(encodeURIComponent).join('/');
              const imageCell = (path, sha, label, alt) => path
                ? `<td><a href="${blobUrl(sha, path)}"><img width="260" alt="${alt}" ` +
                  `src="${rawUrl(sha, path)}"></a></td>`
                : `<td><em>${label}</em></td>`;
              const shown = changes.slice(0, maxRows);
              const rows = shown.map((change) =>
                `<tr><td><code>${change.name}</code></td><td>${change.status}</td>` +
                imageCell(change.before, baseSha, 'not present', `${change.name} before`) +
                imageCell(change.after, headSha, 'not present', `${change.name} after`) +
                '</tr>'
              ).join('\n');
              const omitted = changes.length - shown.length;
              const omission = omitted > 0
                ? `\n\n_${omitted} additional baseline change(s) omitted; review them in the Files tab._`
                : '';
              body = marker + '\n## Committed visual golden changes\n\n' +
                `Before and after images are pinned to this pull request’s ${baseDescription} ` +
                'and head commits.\n\n' +
                '<table><thead><tr><th>Baseline</th><th>Change</th><th>Before (base)</th>' +
                '<th>After (head)</th></tr></thead><tbody>' + rows + '</tbody></table>' + omission;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
            }
