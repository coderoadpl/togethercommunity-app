name: staging-smoke
on:
  deployment_status:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment to smoke; defaults to the CodeRoad staging host
        type: string
        default: https://coderoad.staging.togethercommunity.app
permissions:
  contents: read
concurrency:
  group: staging-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.ref == 'staging' &&
       (startsWith(github.event.deployment_status.environment, 'Preview') ||
        github.event.deployment_status.environment == 'staging'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST_URL: https://coderoad.staging.togethercommunity.app
      STAGING_BASE_URL: ${{ inputs.base_url || 'https://coderoad.staging.togethercommunity.app' }}
      SMOKE_TENANT: ${{ vars.SMOKE_TENANT || 'acme' }}
      PRODUCTION_DATABASE_FINGERPRINT: ${{ vars.PRODUCTION_DATABASE_FINGERPRINT || '4ef296aa90bd' }}
      STAGING_DATABASE_FINGERPRINT: ${{ vars.STAGING_DATABASE_FINGERPRINT }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Decide whether the smoke can run
        id: gate
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ "$STAGING_BASE_URL" != "$STAGING_HOST_URL" ]; then
            echo "::notice::$STAGING_BASE_URL is not the staging host; the bypass secret stays here"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::notice::VERCEL_AUTOMATION_BYPASS_SECRET is absent; staging deployment protection would answer every probe, so the smoke is skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.gate.outputs.run == 'true'
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'
      - name: Smoke the staging deployment
        id: smoke
        if: steps.gate.outputs.run == 'true'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -o pipefail
          if pnpm run smoke:staging 2>&1 | tee staging-smoke.log; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          failing=$(sed -n 's/^smoke:staging: FAIL failing=//p' staging-smoke.log | head -1)
          echo "failing=${failing:-unreachable}" >> "$GITHUB_OUTPUT"
          echo "failed=true" >> "$GITHUB_OUTPUT"
          if grep -q '^smoke:staging: unpinned=true' staging-smoke.log; then
            echo "::notice::the staging database is unpinned; pin STAGING_DATABASE_FINGERPRINT from the summary, no SMS is sent for a missing pin"
            echo "unpinned=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize the staging smoke
        if: always()
        run: |
          [ -f staging-smoke.log ] || exit 0
          {
            echo "### Staging smoke"
            echo ""
            echo "Target: \`$STAGING_BASE_URL\`"
            echo ""
            sed -n 's/^  \[/- [/p' staging-smoke.log
            sed -n 's/^smoke:staging: databaseFingerprint=/> observed database fingerprint: /p' staging-smoke.log
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Send an SMS alert
        if: steps.smoke.outputs.failed == 'true' && steps.smoke.outputs.unpinned != 'true'
        uses: ./.github/actions/alert-sms
        with:
          message: 'Together STAGING smoke FAILED: ${{ steps.smoke.outputs.failing }}'
          aws-access-key-id: ${{ secrets.ALERT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ALERT_AWS_SECRET_ACCESS_KEY }}
          phone-number: ${{ secrets.ALERT_SMS_PHONE }}
      - name: Fail the run on a failing smoke
        if: steps.smoke.outputs.failed == 'true'
        run: |
          echo "::error::staging smoke failing checks: ${{ steps.smoke.outputs.failing }}"
          exit 1
