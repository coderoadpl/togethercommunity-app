name: together-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: together
      POSTGRES_PASSWORD: together
      POSTGRES_DB: together
    ports:
      - '${DB_PORT:-48912}:5432'
    volumes:
      - together-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U together']
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  together-pgdata:
