name: ci

on:
  pull_request:
    branches: [poc-together]
  push:
    branches: [poc-together]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together
          POSTGRES_DB: together
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U together"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://together:together@localhost:5432/together
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: pnpm run check
      - run: pnpm run storybook:build
      - run: pnpm audit --prod --audit-level=moderate

  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together
          POSTGRES_DB: together
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U together"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://together:together@localhost:5432/together
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke
      - run: pnpm run quickstart:probe

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [auth, poc, subs, marketing, coupon]
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together
          POSTGRES_DB: together
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U together"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://together:together@localhost:5432/together
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: matrix.suite == 'auth' || matrix.suite == 'coupon'
        run: google-chrome --version
      - run: pnpm run e2e:${{ matrix.suite }}

  argos-advisory:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: together
          POSTGRES_PASSWORD: together
          POSTGRES_DB: together
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U together"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://together:together@localhost:5432/together
      HAS_ARGOS: ${{ secrets.ARGOS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: google-chrome --version
      - run: pnpm run visual:argos-capture
      - if: env.HAS_ARGOS == 'true'
        run: pnpm exec argos upload out/visual/argos
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        continue-on-error: true
