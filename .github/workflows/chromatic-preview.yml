name: chromatic-preview

on:
  pull_request:
    branches: [staging]
    paths:
      - 'app/apps/web/**'
      - 'app/apps/server/src/**'
      - 'app/.storybook/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/tasks/visual-goldens/**'
      - '.github/workflows/chromatic-preview.yml'
  push:
    branches: [staging]
    paths:
      - 'app/apps/web/**'
      - 'app/apps/server/src/**'
      - 'app/.storybook/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/tasks/visual-goldens/**'
      - '.github/workflows/chromatic-preview.yml'

permissions:
  contents: read

concurrency:
  group: chromatic-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  token:
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          CHROMATIC_PREVIEW_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PREVIEW_PROJECT_TOKEN }}
        run: |
          if [ -n "$CHROMATIC_PREVIEW_PROJECT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHROMATIC_PREVIEW_PROJECT_TOKEN is not available; skipping Chromatic preview."
          fi

  chromatic-preview:
    needs: token
    if: github.event.pull_request.draft != true && needs.token.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect UI changes
        id: ui-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(
            git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
              'app/apps/web/**' \
              'app/apps/server/src/**' \
              'app/core/**' \
              'app/.storybook/**' \
              'app/package.json' \
              'app/pnpm-lock.yaml'
          )"

          if [ -n "$changed_files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Publish Chromatic preview
        env:
          CHROMATIC_PREVIEW_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PREVIEW_PROJECT_TOKEN }}
          CHROMATIC_SKIP: ${{ steps.ui-changes.outputs.changed == 'false' }}
        run: |
          set -- \
            --project-token="$CHROMATIC_PREVIEW_PROJECT_TOKEN" \
            --build-script-name=storybook:build \
            --diagnostics-file=chromatic-diagnostics.json \
            --only-changed \
            --exit-zero-on-changes \
            --exit-once-uploaded \
            --zip
          if [ "$CHROMATIC_SKIP" = "true" ]; then
            set -- "$@" --skip
          fi
          pnpm exec chromatic "$@"
      - name: Upsert Chromatic preview comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          CHROMATIC_SKIPPED: ${{ steps.ui-changes.outputs.changed == 'false' }}
        run: |
          marker='<!-- chromatic-preview -->'
          diagnostics='chromatic-diagnostics.json'

          read_json() {
            if [ -f "$diagnostics" ]; then
              jq -r "$1 // empty" "$diagnostics" | head -n 1
            fi
          }

          build_url="$(read_json '[.buildUrl, .url, .build.webUrl, .rebuildForBuild.webUrl] | map(select(type == "string" and length > 0)) | .[0]')"
          storybook_url="$(read_json '[.storybookUrl, .build.storybookUrl, .rebuildForBuild.storybookUrl] | map(select(type == "string" and length > 0)) | .[0]')"
          change_count="$(read_json '[.changeCount, .build.changeCount, .rebuildForBuild.changeCount] | map(select(type == "number")) | .[0] | tostring')"
          component_count="$(read_json '[.componentCount, .build.componentCount, .rebuildForBuild.componentCount] | map(select(type == "number")) | .[0] | tostring')"

          repo_name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          pages_url="https://${owner}.github.io/${repo_name}/"
          if [ "$BASE_REF" = "staging" ]; then
            pages_url="${pages_url}staging/"
          fi

          body_file="$(mktemp)"
          {
            echo "$marker"
            echo "### Chromatic preview"
            echo
            if [ "$CHROMATIC_SKIPPED" = "true" ]; then
              echo "Chromatic skipped: no UI changes"
            else
              echo "- Chromatic build: ${build_url:-Unavailable}"
              echo "- Chromatic Storybook: ${storybook_url:-Unavailable}"
              echo "- Changed stories: ${change_count:-Unavailable}"
              echo "- Components: ${component_count:-Unavailable}"
            fi
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Base branch Storybook: ${pages_url}"
          } > "$body_file"

          comment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" \
              | head -n 1
          )"

          payload_file="$(mktemp)"
          jq -n --rawfile body "$body_file" '{ body: $body }' > "$payload_file"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$payload_file"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input "$payload_file"
          fi
